<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wave Lab — one crashing wave</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1418}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:crosshair}
  #ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:20px;
      align-items:center;padding:12px 20px;border-radius:100px;
      background:rgba(10,18,22,.55);border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(16px);font:600 10px/1 system-ui,sans-serif;letter-spacing:.18em;
      text-transform:uppercase;color:rgba(230,240,245,.55)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:20px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(230,240,245,.28)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
      background:#5fd0e8;margin-top:-5px;box-shadow:0 0 10px rgba(95,208,232,.7)}
  label{display:flex;gap:9px;align-items:center}
  #hint{position:fixed;top:20px;left:24px;font:500 10px/1.7 system-ui,sans-serif;
      letter-spacing:.16em;text-transform:uppercase;color:rgba(230,240,245,.34)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hint">wave lab · one wave, one field · space pauses</div>
<div id="ui">
  <label>Cycle<input id="ph" type="range" min="0" max="1" step="0.001" value="0"></label>
  <label>Auto<input id="auto" type="range" min="0" max="1" step="0.001" value="1"></label>
</div>
<script>
'use strict';
/* ============================================================
   WAVE LAB — proving the crash in isolation.

   ONE signed-distance field for everything: the sea body and the
   overturning curl are smooth-minimum merged, so they are the same
   fluid (the trick that makes the lava lamp's blobs read as liquid).
   No heightfield, no pasted object, no seam.

   The wave's life follows the hand-drawn sequence:
     rear up -> face goes vertical -> lip throws forward ->
     curl plunges and encloses a tube -> collapse into whitewater.
   ============================================================ */

const VERT = `#version 300 es
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position = vec4(p*2.0-1.0,0.0,1.0); }`;

const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes;
uniform float uT;      // 0..1 through the crash cycle
uniform float uTime;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise2(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}
float fbm(vec2 p){ return 0.55*noise2(p)+0.28*noise2(p*2.1+7.7)+0.17*noise2(p*4.4+3.1); }

/* smooth minimum — the whole point: shapes MERGE into one fluid */
float smin(float a, float b, float k){
  float h = clamp(0.5 + 0.5*(b-a)/k, 0.0, 1.0);
  return mix(b,a,h) - k*h*(1.0-h);
}

/* --- the wave, as one field ------------------------------------------------
   q drives the whole life cycle. The body rears and steepens; the lip grows
   out of the crest, throws forward, and plunges to touch the water ahead. */
float waveSDF(vec3 p, out float lipness){
  float q = uT;
  // seabed rising toward the viewer (+z is toward us)
  float bed = -0.85 + p.z*0.16;

  // ---- the wave body: a ridge that rears and leans forward ----
  float xc = -1.2 + q*2.0;                       // crest travels toward us
  float u = p.z - xc;                            // >0 = in front of the crest (shoreward)
  float H = 0.55 + 0.75*smoothstep(0.0, 0.55, q) - 0.35*smoothstep(0.72, 1.0, q);
  float lean = (0.35 + 1.5*q)*0.55;              // the face pitches forward
  float uu = u + lean*0.42*exp(-pow(u*1.5,2.0));
  float back = 1.0 - smoothstep(0.0, 2.6, -uu);  // long lazy back offshore
  float face = 1.0 - smoothstep(0.0, 0.85 - 0.55*q, uu);  // face steepens with q
  float ridge = clamp(min(back, face), 0.0, 1.0);
  float top = bed + 0.30 + H*pow(ridge, 0.85);
  // chop
  top += 0.035*sin(p.x*4.2 + uTime*1.7)*sin(p.z*3.1 - uTime*1.2)*ridge;
  float body = p.y - top;

  // ---- the overturning lip: a sheet thrown out of the crest ----
  // it exists from the moment the face goes vertical, and plunges as q grows
  float grow = smoothstep(0.18, 0.42, q);
  float shut = smoothstep(0.42, 0.80, q);
  float R = (0.30 + 0.22*grow)*(0.85 + 0.3*H);
  vec2  c = vec2(xc + 0.30*R, bed + 0.30 + H*0.82);   // centre of the curl
  float a0 = 2.15, a1 = a0 - (0.30 + 3.2*shut);       // sweeps forward and down
  float lip = 1e5;
  for (int i=0;i<8;i++){
    float t = float(i)/7.0;
    float a = mix(a0, a1, t);
    // the lip is thrown along the crest with a little lateral waver
    float wav = 0.055*sin(p.x*1.9 + 1.7) + 0.03*sin(p.x*3.7);
    vec2 s = c + (R+wav)*vec2(cos(a), sin(a));
    float thk = (0.085 + 0.05*H)*(1.0 - 0.45*t);      // thins toward the tip
    lip = min(lip, length(vec2(p.z, p.y) - s) - thk);
  }
  lip -= 0.02*fbm(vec2(p.x*3.0, p.y*3.0 + uTime))*grow;   // torn, ragged sheet
  lip += (1.0 - grow)*4.0;                                // absent before it forms

  // ---- ONE FIELD: the lip is not an object on the wave, it IS the wave ----
  float d = smin(body, lip, 0.16 + 0.10*shut);
  lipness = clamp((body - lip)*2.4 + 0.5, 0.0, 1.0);      // how lip-like this point is

  // collapse: after it shuts, the whole thing slumps into a broad mound
  float slump = smoothstep(0.80, 1.0, q);
  float mound = p.y - (bed + 0.30 + 0.30*exp(-pow((p.z - xc - 0.5)*0.9, 2.0)));
  d = mix(d, smin(mound, d, 0.3), slump);
  return d;
}
float waveD(vec3 p){ float l; return waveSDF(p, l); }

vec3 waveN(vec3 p){
  vec2 e = vec2(0.0035, 0.0);
  return normalize(vec3(waveD(p+e.xyy)-waveD(p-e.xyy),
                        waveD(p+e.yxy)-waveD(p-e.yxy),
                        waveD(p+e.yyx)-waveD(p-e.yyx)));
}

vec3 sky(vec3 rd){
  float y = max(rd.y, 0.0);
  vec3 c = mix(vec3(0.62,0.72,0.78), vec3(0.20,0.40,0.62), pow(y,0.55));
  vec3 sun = normalize(vec3(0.35,0.42,-0.84));
  c += vec3(1.5,1.3,1.0)*pow(max(dot(rd,sun),0.0), 60.0)*0.5;
  return c;
}

void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes)/uRes.y;
  // side-on camera, like the drawing
  vec3 ro = vec3(0.0, 0.45, 4.6);
  vec3 fw = normalize(vec3(0.0,-0.07,-1.0));
  vec3 rt = normalize(cross(fw, vec3(0,1,0)));
  vec3 up = cross(rt, fw);
  vec3 rd = normalize(fw*1.5 + rt*uv.x + up*uv.y);
  vec3 sun = normalize(vec3(0.35,0.42,-0.84));

  vec3 col = sky(rd);
  float t = 0.2, hit = -1.0; vec3 p = ro;
  for (int i=0;i<150;i++){
    p = ro + rd*t;
    float d = waveD(p);
    if (d < 0.0016*t){ hit = t; break; }
    t += max(d*0.62, 0.004);           // conservative: the field bounds slopes loosely
    if (t > 14.0) break;
  }

  if (hit > 0.0){
    float lipness; waveSDF(p, lipness);
    vec3 n = waveN(p);
    vec3 vd = -rd;
    float fres = pow(1.0 - max(dot(n,vd),0.0), 4.0);

    // water body: deep green-teal, lighter where thin/lifted
    float dep = clamp(0.9 - (p.y + 0.55)*0.9, 0.0, 1.0);
    vec3 deepC = vec3(0.015,0.10,0.13), shalC = vec3(0.10,0.34,0.36);
    vec3 body = mix(shalC, deepC, dep);

    // light coming THROUGH the thin thrown sheet — what makes a lip glow
    float thin = smoothstep(0.35, 1.0, lipness);
    float thru = pow(clamp(dot(-n, sun)*0.5+0.5, 0.0, 1.0), 2.0);
    body += vec3(0.18,0.62,0.55)*thru*thin*1.5;

    // reflection + sun glint
    vec3 c = body + sky(reflect(rd,n))*(0.10 + 0.62*fres);
    c += vec3(1.6,1.45,1.2)*pow(max(dot(reflect(rd,n),sun),0.0), 55.0)*0.8;

    // whitewater: the tip is torn to foam, and everything the collapse touches
    float tear = fbm(vec2(p.x*5.5, p.z*5.0 + uTime*1.6));
    float foam = smoothstep(0.45,0.95,thin)*smoothstep(0.35,0.75,tear)*0.9
               + smoothstep(0.62,1.0,uT)*smoothstep(0.4,0.8,tear)*0.8
               + smoothstep(0.55,0.9,fres)*0.25;
    c = mix(c, vec3(0.95,0.97,0.98)*(0.85+0.2*tear), clamp(foam,0.0,1.0));

    col = c;
  }

  col = col*(2.51*col+0.03)/(col*(2.43*col+0.59)+0.14);
  col = pow(clamp(col,0.0,1.0), vec3(1.0/2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime))-0.5)*(2.0/255.0);
  fragColor = vec4(col,1.0);
}`;

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', {antialias:false, alpha:false});
function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER,VERT));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const U = {}; for(const n of ['uRes','uT','uTime']) U[n]=gl.getUniformLocation(pr,n);

let W=1,H=1,scale=1;
function rs(){ if(!innerWidth) return; W=innerWidth; H=innerHeight;
  const d=Math.min(devicePixelRatio||1,2)*scale;
  cv.width=Math.max(2,Math.round(W*d)); cv.height=Math.max(2,Math.round(H*d));
  gl.viewport(0,0,cv.width,cv.height); }
addEventListener('resize',rs); rs();

const phEl=document.getElementById('ph'), autoEl=document.getElementById('auto');
let paused=false;
addEventListener('keydown',e=>{ if(e.key===' '){paused=!paused; e.preventDefault();} });

let simT=0, last=performance.now(), ema=8, fr=0;
const Q=new URLSearchParams(location.search);
if(Q.has('q')){ phEl.value=Q.get('q'); autoEl.value=0; }
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(dt>0.1)dt=0.1;
  ema=ema*0.95+dt*1000*0.05;
  if(++fr%48===0){ if(ema>16&&scale>0.5){scale=Math.max(0.5,scale*0.85);rs();}
                   else if(ema<9.5&&scale<1){scale=Math.min(1,scale*1.1);rs();} }
  if(!paused) simT+=dt;
  const auto=+autoEl.value;
  // the cycle: 3.4s per wave, or scrub it by hand
  const q = auto>0.02 ? (simT/3.4)%1 : +phEl.value;
  if(auto>0.02) phEl.value=q;
  gl.uniform2f(U.uRes,cv.width,cv.height);
  gl.uniform1f(U.uT,q);
  gl.uniform1f(U.uTime,simT);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
